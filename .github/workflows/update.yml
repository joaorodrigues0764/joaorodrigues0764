name: Update README

# Generates the SVGs and publishes them to the "output" branch, so that
# automated commits never land on main (and never show up as contributors).
on:
  schedule:
    - cron: "17 4 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generate.py", "ascii.txt", ".github/workflows/update.yml", "README.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python generate.py
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            snake/github-snake.svg
            snake/github-snake-dark.svg?palette=github-dark
      - name: Publish to output branch
        run: |
          mkdir out && cp dark_mode.svg light_mode.svg cargo_build.svg snake/*.svg out/
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Update profile SVGs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
