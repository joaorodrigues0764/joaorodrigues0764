name: Update README

# Generates the SVGs and publishes them to the "output" branch, so that
# automated commits never land on main (and never show up as contributors).
on:
  schedule:
    - cron: "17 4 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["generate.py", "tweak_3d.py", "3d_settings.json", "ascii.txt", ".github/workflows/update.yml", "README.md"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
        run: python generate.py
      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: 3d_settings.json
      - name: Tweak 3D graph (show "Last Year", drop stars and forks)
        run: python tweak_3d.py profile-3d-contrib/profile-red-dark.svg profile-3d-contrib/profile-red-light.svg
      - name: Publish to output branch
        run: |
          mkdir out && cp dark_mode.svg light_mode.svg btn_*.svg profile-3d-contrib/profile-red-dark.svg profile-3d-contrib/profile-red-light.svg out/
          cd out
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Update profile SVGs"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
